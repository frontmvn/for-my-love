<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Люблю веру ❤️</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            height: 100vh;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 30px;
            animation: fly 5s linear forwards;
            pointer-events: none;
        }

        @keyframes fly {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform: translateY(-50vh) scale(1);
            }

            100% {
                transform: translateY(-110vh) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<script>
    function createHeart() {
        const heart = document.createElement("div");

        heart.className = "heart";
        heart.innerHTML = "Люблю леру ❤️";

        heart.style.color = "#ff1493"; 

        heart.style.left = Math.random() * 100 + "vw";

        // Случайный размер
        heart.style.fontSize = (20 + Math.random() * 40) + "px";

        // Случайная скорость
        heart.style.animationDuration = (3 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        // Удаляем сердце после анимации
        setTimeout(() => {
            heart.remove();
        }, 7000);
    }

    // Сердечки начинают появляться сразу после открытия файла
    setInterval(createHeart, 200);
</script>

</body>
</html>
